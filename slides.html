<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The Hugging Face Incident and the State of AI Disclosure</title>
<style>
  :root {
    --chrome: #23272e;
    --chrome-2: #1b1e24;
    --accent: #d98324;
    --bg: #f4f5f7;
    --ink: #1a1a1a;
    --muted: #6b7280;
    --line: #d8dbe0;
    --earned: #2f79c0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--chrome-2);
    color: var(--ink);
    overflow: hidden;
  }

  /* deck frame: a 16:9 stage centered on a dark backdrop */
  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #slide {
    position: relative;
    width: min(1120px, 96vw);
    aspect-ratio: 16 / 9;
    max-height: 92vh;
    background: var(--bg);
    border-radius: 12px;
    box-shadow: 0 18px 60px rgba(0,0,0,0.5);
    overflow: hidden;
  }
  .slide-inner {
    position: absolute;
    inset: 0;
    padding: 54px 64px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .kicker {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--accent);
    margin-bottom: 14px;
  }
  h1.slide-title {
    font-size: 40px;
    line-height: 1.1;
    letter-spacing: -0.015em;
    margin: 0 0 10px;
    font-weight: 700;
  }
  h2.slide-title {
    font-size: 30px;
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin: 0 0 20px;
    font-weight: 700;
  }
  .lede { font-size: 19px; line-height: 1.5; color: #2a2f38; max-width: 44ch; }
  .lede.wide { max-width: 60ch; }
  ul.pts { margin: 6px 0 0; padding: 0; list-style: none; }
  ul.pts li {
    font-size: 18px; line-height: 1.4; color: #2a2f38;
    padding: 9px 0 9px 26px; position: relative;
  }
  ul.pts li::before {
    content: ""; position: absolute; left: 0; top: 17px;
    width: 8px; height: 8px; border-radius: 2px; background: var(--accent);
  }
  ul.pts li b { color: var(--ink); }
  .muted { color: var(--muted); }
  .fill { flex: 1 1 auto; }

  /* dark full-bleed slides for the big beats */
  #slide.dark { background: var(--chrome); }
  #slide.dark .slide-inner { color: #fff; }
  #slide.dark h1.slide-title, #slide.dark h2.slide-title { color: #fff; }
  #slide.dark .lede { color: #dfe3e8; }
  #slide.dark ul.pts li { color: #dfe3e8; }
  #slide.dark ul.pts li b { color: #fff; }
  #slide.dark .kicker { color: var(--accent); }
  #slide.dark .muted { color: #9aa3b0; }

  .big-quote {
    font-size: 30px; line-height: 1.32; font-weight: 500; letter-spacing: -0.01em;
    max-width: 24ch; margin: 6px 0 0;
  }
  .quote-attr { font-size: 15px; color: var(--muted); margin-top: 18px; }
  #slide.dark .quote-attr { color: #9aa3b0; }
  .quote-attr::before { content: "\2014 "; }

  /* compact pull-quote list for the report-recap slides */
  ul.pullquotes { margin: 16px 0 0; padding: 0; list-style: none; }
  ul.pullquotes li {
    font-size: 15.5px; line-height: 1.4; color: #2a2f38;
    padding: 7px 0 7px 16px; border-left: 3px solid var(--accent);
    margin-bottom: 9px; font-style: italic;
  }
  ul.pullquotes li cite {
    display: block; font-style: normal; font-size: 12px;
    color: var(--muted); margin-top: 4px;
  }
  #slide.dark ul.pullquotes li { color: #dfe3e8; }

  /* launch card for the two interactive artifacts */
  .launch {
    margin-top: 8px;
    display: inline-flex; align-items: center; gap: 12px;
    background: var(--accent); color: #fff; text-decoration: none;
    font-size: 17px; font-weight: 600; border-radius: 10px;
    padding: 13px 20px;
    box-shadow: 0 3px 12px rgba(217,131,36,0.4);
  }
  .launch:hover { background: #c2751f; }
  .launch .arrow { font-size: 20px; }
  .launch-note { font-size: 13px; color: var(--muted); margin-top: 12px; }
  #slide.dark .launch-note { color: #9aa3b0; }

  /* on-slide mini timeline (slide 1) */
  ul.timeline-mini { margin: 14px 0 0; padding: 0; list-style: none; }
  ul.timeline-mini li {
    display: flex; gap: 16px; align-items: baseline;
    padding: 7px 0; border-bottom: 1px solid var(--line);
    font-size: 15px; line-height: 1.35; color: #2a2f38;
  }
  ul.timeline-mini li:last-child { border-bottom: none; }
  ul.timeline-mini .tl-date {
    flex: 0 0 92px; font-weight: 800; color: var(--accent);
    font-variant-numeric: tabular-nums; font-size: 14px;
  }
  ul.timeline-mini .tl-what { flex: 1; }
  ul.timeline-mini li.tl-soft { color: var(--muted); font-size: 13.5px; }
  ul.timeline-mini li.tl-soft .tl-date { color: var(--muted); font-weight: 700; }
  ul.timeline-mini li.tl-soft .tl-what b { color: #4a5158; }

  /* two-column and crack layouts */
  .cols { display: flex; gap: 34px; margin-top: 6px; }
  .cols .col { flex: 1; }
  .col h3 { font-size: 16px; margin: 0 0 8px; color: var(--accent); font-weight: 700; }

  .crack-num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 22px; font-weight: 800;
    margin-bottom: 16px;
  }
  .crack-bites {
    margin-top: auto; font-size: 14px; color: var(--muted);
    border-top: 1px solid rgba(255,255,255,0.14); padding-top: 12px;
  }
  #slide:not(.dark) .crack-bites { border-top-color: var(--line); }
  .crack-bites b { color: var(--accent); }

  /* CSET nine-component checklist (slide 4a): three clusters */
  .clusters { display: flex; gap: 30px; margin-top: 10px; }
  .cluster { flex: 1; }
  .cluster h3 {
    font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--accent); margin: 0 0 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
  }
  #slide.dark .cluster h3 { border-bottom-color: rgba(255,255,255,0.14); }
  ul.checklist { margin: 0; padding: 0; list-style: none; }
  ul.checklist li {
    font-size: 16px; line-height: 1.35; color: #2a2f38;
    padding: 8px 0 8px 30px; position: relative;
  }
  #slide.dark ul.checklist li { color: #dfe3e8; }
  ul.checklist li .cn { font-weight: 600; }
  #slide.dark ul.checklist li .cn { color: #fff; }
  ul.checklist li .cnum {
    position: absolute; left: 0; top: 8px;
    font-variant-numeric: tabular-nums; font-weight: 800; color: var(--accent); font-size: 15px;
  }
  ul.checklist li .sub { display: block; font-size: 13px; color: var(--muted); line-height: 1.3; }

  /* scorecard: nine components graded with a verdict mark (slide 4b) */
  ul.scorecard { margin: 6px 0 0; padding: 0; list-style: none; }
  ul.scorecard li {
    display: flex; align-items: baseline; gap: 12px;
    padding: 6px 0; border-bottom: 1px solid var(--line);
    font-size: 15px; line-height: 1.3;
  }
  #slide.dark ul.scorecard li { border-bottom-color: rgba(255,255,255,0.1); }
  ul.scorecard li:last-child { border-bottom: none; }
  .verdict {
    flex: 0 0 auto; width: 20px; height: 20px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 800; color: #fff; align-self: center;
  }
  .verdict.pass { background: #3d8b5f; }
  .verdict.warn { background: var(--accent); }
  .verdict.fail { background: #c0392b; }
  .sc-cn { flex: 0 0 158px; font-weight: 600; }
  #slide.dark .sc-cn { color: #fff; }
  .sc-ev { flex: 1; color: #2a2f38; font-size: 13.5px; }
  #slide.dark .sc-ev { color: #c9cfd7; }
  /* compact variant so all nine components + tally + footer fit the stage */
  ul.scorecard.compact li { padding: 4px 0; font-size: 13.5px; }
  ul.scorecard.compact .sc-cn { flex: 0 0 148px; }
  ul.scorecard.compact .sc-ev { font-size: 12.5px; line-height: 1.25; }
  ul.scorecard.compact .verdict { width: 18px; height: 18px; font-size: 11px; }
  .tally { display: flex; gap: 18px; margin-top: 14px; font-size: 14px; align-items: center; }
  .tally span { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); }
  .tally .verdict { width: 16px; height: 16px; font-size: 10px; }

  /* rubric table */
  table.rubric {
    width: 100%; border-collapse: collapse; margin-top: 4px; font-size: 13.5px;
  }
  table.rubric th, table.rubric td {
    text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  table.rubric thead th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  table.rubric td.n { color: var(--muted); font-weight: 700; width: 34px; font-variant-numeric: tabular-nums; }
  table.rubric td.cn { font-weight: 600; width: 210px; }
  table.rubric tr.repair td { background: rgba(217,131,36,0.10); }
  table.rubric tr.repair td.cn { color: #a85f12; }
  .repair-badge {
    display:inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase;
    background: var(--accent); color: #fff; border-radius: 4px; padding: 1px 6px; margin-left: 8px;
    letter-spacing: 0.03em; vertical-align: middle;
  }

  /* inversion diagram */
  .inversion { display: flex; gap: 40px; margin-top: 10px; align-items: stretch; }
  .inv-col { flex: 1; }
  .inv-col h3 { font-size: 15px; color: var(--accent); margin: 0 0 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
  .rankrow {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 8px;
    background: #fff; border: 1px solid var(--line); border-radius: 8px; font-size: 16px;
  }
  #slide.dark .rankrow { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); color: #fff; }
  .rankrow .rank { font-size: 12px; font-weight: 700; color: var(--muted); width: 58px; }
  .rankrow .who { font-weight: 700; }
  .rankrow .desc { font-size: 13px; color: var(--muted); margin-left: auto; }
  #slide.dark .rankrow .desc { color: #9aa3b0; }
  .rankrow.best { border-left: 4px solid #3d8b5f; }
  .rankrow.mid  { border-left: 4px solid var(--accent); }
  .rankrow.worst{ border-left: 4px solid #c0392b; }

  /* progress + chrome */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 4px;
    background: rgba(255,255,255,0.08); z-index: 40;
  }
  #progress { height: 100%; background: var(--accent); width: 0; transition: width 0.2s ease; }
  #hud {
    position: fixed; bottom: 14px; right: 18px; z-index: 40;
    font-size: 12px; color: #7a828e;
    display: flex; align-items: center; gap: 14px;
  }
  #hud .sec { color: #aab1bc; }
  #hud kbd {
    font-family: inherit; background: #2f353f; color: #cfd4db; border: 1px solid #3f4653;
    border-radius: 4px; padding: 1px 6px; font-size: 11px;
  }
  #dots {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 40;
    display: flex; gap: 7px;
  }
  #dots .dot {
    width: 8px; height: 8px; border-radius: 50%; background: #454c58; cursor: pointer;
  }
  #dots .dot.on { background: var(--accent); }

  /* speaker notes drawer */
  #notes {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    background: #14161a; color: #d7dbe0; border-top: 2px solid var(--accent);
    max-height: 42vh; overflow-y: auto; transform: translateY(100%);
    transition: transform 0.2s ease; padding: 18px 26px 22px;
  }
  #notes.open { transform: translateY(0); }
  #notes h4 { margin: 0 0 8px; color: var(--accent); font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; }
  #notes .body { font-size: 15px; line-height: 1.55; max-width: 80ch; }
  #notes .body p { margin: 0 0 10px; }
  #notes .body b { color: #fff; }
  #notes .empty { color: #7a828e; font-style: italic; }
</style>
</head>
<body>
<div id="topbar"><div id="progress"></div></div>

<div id="stage">
  <div id="slide">
    <div class="slide-inner" id="slide-inner"></div>
  </div>
</div>

<div id="dots"></div>
<div id="hud">
  <span class="sec" id="hud-sec"></span>
  <span id="hud-count"></span>
  <span><kbd>&larr;</kbd> <kbd>&rarr;</kbd> move · <kbd>N</kbd> notes · <kbd>F</kbd> full</span>
</div>

<div id="notes"><h4>Speaker notes</h4><div class="body" id="notes-body"></div></div>

<script>

let cur = 0;
let notesOpen = false;

const slideEl = document.getElementById("slide");
const innerEl = document.getElementById("slide-inner");

function render() {
  const s = SLIDES[cur];
  slideEl.className = s.dark ? "dark" : "";
  innerEl.innerHTML = s.html;

  document.getElementById("progress").style.width = ((cur+1)/SLIDES.length*100) + "%";
  document.getElementById("hud-sec").textContent = s.section || "";
  document.getElementById("hud-count").textContent = (cur+1) + " / " + SLIDES.length;

  const nb = document.getElementById("notes-body");
  nb.innerHTML = s.notes ? s.notes : `<p class="empty">No notes for this slide.</p>`;

  const dots = document.getElementById("dots");
  dots.innerHTML = "";
  SLIDES.forEach((_, i) => {
    const d = document.createElement("div");
    d.className = "dot" + (i === cur ? " on" : "");
    d.title = SLIDES[i].section || ("Slide " + (i+1));
    d.addEventListener("click", () => { cur = i; render(); });
    dots.appendChild(d);
  });
}

function go(n) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, n));
  render();
}

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); go(cur+1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(cur-1); }
  else if (e.key === "Home") go(0);
  else if (e.key === "End") go(SLIDES.length-1);
  else if (e.key.toLowerCase() === "n") {
    notesOpen = !notesOpen;
    document.getElementById("notes").classList.toggle("open", notesOpen);
  }
  else if (e.key.toLowerCase() === "f") {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});

render();
window.__DECK = {
  slideCount: SLIDES.length,
  cur: () => cur,
  go,
  sections: () => [...new Set(SLIDES.map(s => s.section))],
};
console.log("[deck] slides", SLIDES.length);
